# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - entramap

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      # Upload artifact for deployment jobs
      # Oryx (Azure build engine) will handle venv creation and dependency installation
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/
            !.venv/
            !venv/
            !__pycache__/
            !*.pyc
            !**/node_modules/

  validate:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression suite
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test planner interactions
        run: |
          npm ci --prefix tests/frontend --ignore-scripts
          npm test --prefix tests/frontend

      - name: Run smoke check
        env:
          CLIENT_ID: smoke-test-client
          CLIENT_SECRET: smoke-test-secret
          FLASK_SECRET_KEY: smoke-test-secret-key
          FLASK_DEBUG: "false"
          NO_START: "0"
        run: |
          chmod +x scripts/smoke-check.sh
          scripts/smoke-check.sh http://127.0.0.1:5000

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: ./release

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AD45A40BCB5D4A669AAB1D4BBFD40EA2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_50935D82CEBE4B0491DC920F0AB1D59D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8E3D4118C473446FA65ECC9DAF5F9DC9 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'entramap'
          slot-name: 'Production'
          package: ./release

